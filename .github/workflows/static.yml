# Workflow for testing and deploying static content to GitHub Pages
name: Build and Deploy to GitHub Pages

on:
    # Runs on pushes targeting the specified branches
    push:
        branches: ["main", "initial-portfolio-implementation"]

    # Allows you to run this workflow manually from the Actions tab
        workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
    contents: read
    pages: write
    id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
    group: "pages"
    cancel-in-progress: false

jobs:
    # Build job runs on both branches
    build:
        runs-on: ubuntu-latest
        steps:
          - name: Checkout
            uses: actions/checkout@v4

          - name: Setup Node.js
            uses: actions/setup-node@v4
            with:
                node-version: 22
                cache: npm
                cache-dependency-path: frontend/package-lock.json

          - name: Install dependencies and build
            working-directory: frontend
            run: |
                npm ci
                npm run build

            # Configure Pages and upload artifact only on main
          - name: Setup Pages
            if: github.ref == 'refs/heads/main'
            uses: actions/configure-pages@v5

          - name: Upload artifact
            if: github.ref == 'refs/heads/main'
            uses: actions/upload-pages-artifact@v3
            with:
                # Upload the production build
                path: 'frontend/dist'

    # Deploy job runs only on main after a successful build
    deploy:
        if: github.ref == 'refs/heads/main'
        needs: build
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        steps:
          - name: Deploy to GitHub Pages
            id: deployment
            uses: actions/deploy-pages@v5
